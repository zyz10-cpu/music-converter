<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KGMA / KGM 音频转换器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🎵 加密音乐转换器</h1>
      <p class="subtitle">本地解密 · 文件不出浏览器 · 支持 kgm/kgma/ncm/kwm/xm/qmc/mflac/mgg</p>
    </header>

    <div id="dropZone" class="drop-zone" tabindex="0">
      <div class="drop-icon">📁</div>
      <p>拖拽加密音乐文件到这里（酷狗 / 网易云 / QQ音乐 / 酷我 / 虾米）</p>
      <button id="pickBtn" class="btn" type="button">选择文件</button>
      <input type="file" id="fileInput" accept=".kgm,.kgma,.vpr,.ncm,.kwm,.xm,.qmc0,.qmc3,.qmcflac,.qmcogg,.mflac,.mgg" multiple hidden />
    </div>

    <section class="options">
      <label class="field">
        <span>输出格式</span>
        <select id="format">
          <option value="auto">原始格式（无损还原）</option>
          <option value="mp3">MP3</option>
          <option value="flac">FLAC</option>
          <option value="wav">WAV</option>
          <option value="aac">AAC</option>
        </select>
      </label>
      <label class="field" id="bitrateField">
        <span>有损码率（MP3 / AAC）</span>
        <select id="bitrate">
          <option value="320">320 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
        </select>
      </label>
    </section>

    <p class="hint">
      提示：<strong>原始格式（无损还原）</strong>直接解出加密前的音频（MP3/FLAC/OGG/WAV 等），不重新编码、零损耗；
      转 FLAC/WAV 不提升音质，转 MP3/AAC 为有损压缩。
    </p>

    <div id="status" class="status">正在初始化…</div>

    <ul id="fileList" class="file-list"></ul>
  </main>

  <script src="./kgm.js"></script>
  <script src="./formats.js"></script>
  <script src="./app.js"></script>
</body>
</html>
