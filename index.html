<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KGMA / KGM 音频转换器</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header>
      <h1>🎵 加密音乐转换器</h1>
      <p class="subtitle">本地解密 · 文件不出浏览器 · 支持酷狗 kgm/kgma · 网易云 ncm</p>
    </header>

    <div id="dropZone" class="drop-zone" tabindex="0">
      <div class="drop-icon">📁</div>
      <p>拖拽酷狗 .kgm/.kgma 或网易云 .ncm 文件到这里</p>
      <button id="pickBtn" class="btn" type="button">选择文件</button>
      <input type="file" id="fileInput" accept=".kgm,.kgma,.ncm" multiple hidden />
    </div>

    <section class="options">
      <label class="field">
        <span>输出格式</span>
        <select id="format">
          <option value="original" selected>原始格式（仅解密，最快）</option>
          <option value="flac">FLAC</option>
          <option value="mp3">MP3</option>
          <option value="wav">WAV</option>
          <option value="aac">AAC</option>
        </select>
      </label>
      <label class="field" id="bitrateField">
        <span>有损码率（MP3 / AAC）</span>
        <select id="bitrate">
          <option value="320">320 kbps</option>
          <option value="192">192 kbps</option>
          <option value="128">128 kbps</option>
        </select>
      </label>
    </section>

    <p class="hint">
      提示：默认输出「原始格式」只解密不转码，速度最快、零音质损失；选 MP3/AAC 为有损压缩，转码时才需联网加载 ffmpeg 引擎。<br />
      注意：网易云「菁彩声/沉浸声」音质的 NCM 无法转码（任何工具都不行），只有<b>无损及以下音质</b>才可转码——下载时请在网易云设置里选「无损音质」。
    </p>

    <div id="status" class="status">正在初始化…</div>

    <ul id="fileList" class="file-list"></ul>
  </main>

  <script src="./kgm.js"></script>
  <script src="./formats.js"></script>
  <script src="./app.js"></script>
</body>
</html>
